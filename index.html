<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grade de Pintura</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --bg: #f6f5f2;
    --panel: #ffffff;
    --ink: #1f2328;
    --muted: #6b7280;
    --line: #d5d3cd;
    --accent: #2f6f4f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  .app {
    max-width: 1500px;
    margin: 0 auto;
    padding: 20px 16px 40px;
    display: flex;
    gap: 16px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
  }
  header { width: 100%; text-align: center; }
  h1 { font-size: 1.35rem; margin: 0 0 4px; }
  header p { margin: 0; color: var(--muted); font-size: .9rem; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px;
    width: 190px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    font-size: .85rem;
    position: sticky;
    top: 12px;
  }
  .panel h2 {
    font-size: .8rem;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    margin: 0 0 8px;
  }
  .swatches {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 4px;
  }
  .swatch {
    aspect-ratio: 1;
    border-radius: 4px;
    border: 1px solid rgba(0,0,0,.15);
    cursor: pointer;
    padding: 0;
  }
  .swatch.active { outline: 2px solid var(--ink); outline-offset: 1px; }
  .custom {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
    font-size: .9rem;
  }
  .custom input[type=color] {
    width: 34px; height: 26px;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 2px;
    background: #fff;
    cursor: pointer;
  }
  .current {
    display: flex; align-items: center; gap: 10px;
    font-size: .9rem;
  }
  .current span.box {
    width: 28px; height: 28px; border-radius: 6px;
    border: 1px solid rgba(0,0,0,.2);
  }
  code { font-size: .85rem; color: var(--muted); }

  label.field { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; }
  label.field input {
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font: inherit;
  }
  .check { display: flex; gap: 8px; align-items: center; font-size: .85rem; }

  button.btn {
    font: inherit;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #fff;
    cursor: pointer;
  }
  button.btn:hover { background: #f1f0ec; }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  button.primary:hover { background: #25593f; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .status { font-size: .82rem; color: var(--muted); min-height: 1.2em; }
  .count { font-size: .85rem; color: var(--muted); }

  .board-wrap {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px;
  }
  .layout {
    --size: clamp(560px, calc(100vw - 290px), 1150px);
    --n: 41;
    --cell: calc(var(--size) / var(--n));
    display: grid;
    grid-template-columns: calc(var(--cell) * 2) var(--size);
    grid-template-rows: calc(var(--cell) * 1.6) var(--size);
  }
  .ruler {
    display: grid;
    font-size: max(10px, calc(var(--cell) * 0.78));
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    user-select: none;
  }
  .ruler span {
    display: flex; align-items: center; justify-content: center;
    line-height: 1; overflow: visible; white-space: nowrap;
  }
  .ruler.top span { align-items: flex-end; padding-bottom: 2px; }
  .ruler.left span { justify-content: flex-end; padding-right: 3px; }
  .ruler span.mark { color: var(--ink); font-weight: 700; }
  .ruler span.hl { background: #e8efe9; color: var(--accent); font-weight: 700; border-radius: 3px; }
  .board {
    width: var(--size);
    height: var(--size);
    display: grid;
    border-top: 1px solid #b9b6ae;
    border-left: 1px solid #b9b6ae;
    user-select: none;
    touch-action: manipulation;
  }
  .sizes { display: flex; gap: 4px; }
  .size-btn {
    flex: 1;
    font: inherit;
    font-size: .82rem;
    padding: 6px 0;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
  }
  .size-btn:hover { background: #f1f0ec; }
  .size-btn.active { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 600; }
  .cell {
    border-right: 1px solid #d9d6cf;
    border-bottom: 1px solid #d9d6cf;
    background: #fff;
    cursor: pointer;
  }
  /* linhas-guia a cada 10 quadrados e no centro */
  .cell.c10 { border-right-color: #9e9a91; }
  .cell.r10 { border-bottom-color: #9e9a91; }
  .cell:hover { box-shadow: inset 0 0 0 2px rgba(0,0,0,.25); }

  .modal-bg {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.35);
    display: none; align-items: center; justify-content: center;
    z-index: 10;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: #fff; border-radius: 12px; padding: 20px;
    width: min(340px, 90vw);
  }
  .modal p { margin: 0 0 16px; }
  .modal .row { display: flex; gap: 8px; justify-content: flex-end; }

  @media (max-width: 700px) {
    .panel { width: 100%; position: static; }
    .layout { --size: 84vw; }
    .board-wrap { padding: 6px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="title">Grade de Pintura 41×41</h1>
    <p>Escolha uma cor e clique nos quadrados. Clicar num quadrado já preenchido apaga o preenchimento.</p>
  </header>

  <div class="board-wrap">
    <div class="layout" id="layout">
      <div></div>
      <div class="ruler top" id="rulerTop" aria-hidden="true"></div>
      <div class="ruler left" id="rulerLeft" aria-hidden="true"></div>
      <div class="board" id="board"></div>
    </div>
  </div>

  <aside class="panel">
    <div>
      <h2>Grade</h2>
      <div class="sizes" id="sizes"></div>
    </div>

    <div>
      <h2>Cor</h2>
      <div class="swatches" id="swatches"></div>
      <div class="custom">
        <input type="color" id="picker" value="#2f6f4f" aria-label="Escolher cor personalizada">
        <span>Cor personalizada</span>
      </div>
    </div>

    <div class="current">
      <span class="box" id="currentBox"></span>
      <div>Cor atual<br><code id="currentHex"></code></div>
    </div>

    <div class="count" id="count">0 quadrados preenchidos</div>

    <div>
      <h2>Salvar em PDF</h2>
      <div style="display:flex;flex-direction:column;gap:10px">
        <label class="field">Nome do arquivo
          <input type="text" id="fname" value="">
        </label>
        <label class="check"><input type="checkbox" id="showLines" checked> Mostrar linhas da grade</label>
        <label class="check"><input type="checkbox" id="showRulers" checked> Incluir réguas numeradas</label>
        <button class="btn primary" id="savePdf">Salvar PDF</button>
        <div class="status" id="status"></div>
      </div>
    </div>

    <button class="btn" id="clearAll">Limpar tudo</button>
  </aside>
</div>

<div class="modal-bg" id="confirmBg">
  <div class="modal" role="dialog" aria-modal="true">
    <p>Apagar todos os quadrados preenchidos desta grade?</p>
    <div class="row">
      <button class="btn" id="cancelClear">Cancelar</button>
      <button class="btn primary" id="okClear">Apagar</button>
    </div>
  </div>
</div>

<script>
(function () {
  const SIZES = [33, 41, 42];
  const STORE_PREFIX = "grade-pintura-v2-";
  const PALETTE = [
    "#000000", "#5f6368", "#c0392b", "#e67e22", "#f1c40f", "#27ae60",
    "#2f6f4f", "#16a085", "#2980b9", "#1f3a93", "#8e44ad", "#d35490",
    "#8b5a2b", "#f5cba7", "#a9dfbf", "#aed6f1", "#d7bde2", "#ffffff"
  ];

  let N = 41;
  let cells = [];          // null = vazio, ou "#rrggbb"
  let color = "#2f6f4f";
  let els = [], topEls = [], leftEls = [];

  const layout = document.getElementById("layout");
  const board = document.getElementById("board");
  const rulerTop = document.getElementById("rulerTop");
  const rulerLeft = document.getElementById("rulerLeft");
  const swatchBox = document.getElementById("swatches");
  const picker = document.getElementById("picker");
  const currentBox = document.getElementById("currentBox");
  const currentHex = document.getElementById("currentHex");
  const countEl = document.getElementById("count");
  const statusEl = document.getElementById("status");
  const titleEl = document.getElementById("title");
  const fnameEl = document.getElementById("fname");
  const sizeBox = document.getElementById("sizes");

  // ---------- linhas-guia ----------
  // Retorna true se a borda DEPOIS da posição k (1..N) deve ser reforçada:
  // a cada 10 quadrados e em volta do centro (quadrado central se N for ímpar,
  // linha central se N for par).
  function isGuide(k) {
    if (k % 10 === 0) return true;
    if (N % 2 === 1) { const m = (N + 1) / 2; return k === m - 1 || k === m; }
    return k === N / 2;
  }
  // números em destaque na régua
  function isMark(k) {
    if (k === 1 || k % 5 === 0) return true;
    if (N % 2 === 1) return k === (N + 1) / 2;
    return k === N / 2 || k === N / 2 + 1;
  }

  // ---------- armazenamento local (um desenho por tamanho) ----------
  function save() {
    try { localStorage.setItem(STORE_PREFIX + N, JSON.stringify(cells)); } catch (_) {}
    try { localStorage.setItem(STORE_PREFIX + "settings", JSON.stringify({ N, color })); } catch (_) {}
  }
  function load(n) {
    try {
      const c = JSON.parse(localStorage.getItem(STORE_PREFIX + n) || "null");
      if (Array.isArray(c) && c.length === n * n) return c;
    } catch (_) {}
    return new Array(n * n).fill(null);
  }

  // ---------- montar a grade ----------
  function build(n) {
    N = n;
    cells = load(N);
    layout.style.setProperty("--n", N);
    board.style.gridTemplateColumns = `repeat(${N}, 1fr)`;
    board.style.gridTemplateRows = `repeat(${N}, 1fr)`;
    rulerTop.style.gridTemplateColumns = `repeat(${N}, 1fr)`;
    rulerLeft.style.gridTemplateRows = `repeat(${N}, 1fr)`;
    board.setAttribute("aria-label", `Grade de ${N} por ${N} quadrados`);
    titleEl.textContent = `Grade de Pintura ${N}×${N}`;
    if (/^grade-\d+x\d+$/.test(fnameEl.value.trim()) || !fnameEl.value.trim()) {
      fnameEl.value = `grade-${N}x${N}`;
    }

    board.innerHTML = ""; rulerTop.innerHTML = ""; rulerLeft.innerHTML = "";
    els = []; topEls = []; leftEls = []; hlC = hlR = -1;

    const frag = document.createDocumentFragment();
    for (let i = 0; i < N * N; i++) {
      const r = Math.floor(i / N), c = i % N;
      const d = document.createElement("div");
      d.className = "cell";
      if (isGuide(c + 1)) d.classList.add("c10");
      if (isGuide(r + 1)) d.classList.add("r10");
      d.dataset.i = i;
      d.style.background = cells[i] || "#fff";
      frag.appendChild(d);
      els.push(d);
    }
    board.appendChild(frag);

    for (let k = 1; k <= N; k++) {
      const a = document.createElement("span");
      const b = document.createElement("span");
      a.textContent = b.textContent = k;
      if (isMark(k)) { a.classList.add("mark"); b.classList.add("mark"); }
      rulerTop.appendChild(a); rulerLeft.appendChild(b);
      topEls.push(a); leftEls.push(b);
    }

    sizeBox.querySelectorAll("button").forEach(b =>
      b.classList.toggle("active", Number(b.dataset.n) === N));
    afterChange();
  }

  // ---------- seletor de tamanho ----------
  SIZES.forEach(n => {
    const b = document.createElement("button");
    b.className = "size-btn";
    b.dataset.n = n;
    b.textContent = `${n}×${n}`;
    b.addEventListener("click", () => { if (n !== N) build(n); });
    sizeBox.appendChild(b);
  });

  // ---------- clique e destaque ----------
  board.addEventListener("click", (e) => {
    const t = e.target.closest(".cell");
    if (!t) return;
    const i = Number(t.dataset.i);
    cells[i] = cells[i] ? null : color;   // preenchido -> apaga; vazio -> pinta
    els[i].style.background = cells[i] || "#fff";
    afterChange();
  });

  let hlC = -1, hlR = -1;
  function highlight(r, c) {
    if (hlC >= 0 && topEls[hlC]) topEls[hlC].classList.remove("hl");
    if (hlR >= 0 && leftEls[hlR]) leftEls[hlR].classList.remove("hl");
    hlC = c; hlR = r;
    if (c >= 0) topEls[c].classList.add("hl");
    if (r >= 0) leftEls[r].classList.add("hl");
  }
  board.addEventListener("mouseover", (e) => {
    const t = e.target.closest(".cell");
    if (!t) return;
    const i = Number(t.dataset.i);
    highlight(Math.floor(i / N), i % N);
  });
  board.addEventListener("mouseleave", () => highlight(-1, -1));

  // ---------- cores ----------
  function setColor(hex) {
    color = hex.toLowerCase();
    currentBox.style.background = color;
    currentHex.textContent = color.toUpperCase();
    picker.value = color;
    swatchBox.querySelectorAll(".swatch").forEach(s =>
      s.classList.toggle("active", s.dataset.c === color));
    save();
  }
  PALETTE.forEach(hex => {
    const b = document.createElement("button");
    b.className = "swatch";
    b.style.background = hex;
    b.dataset.c = hex.toLowerCase();
    b.title = hex.toUpperCase();
    b.setAttribute("aria-label", "Cor " + hex);
    b.addEventListener("click", () => setColor(hex));
    swatchBox.appendChild(b);
  });
  picker.addEventListener("input", () => setColor(picker.value));

  function afterChange() {
    const n = cells.filter(Boolean).length;
    countEl.textContent = n === 1 ? "1 quadrado preenchido" : n + " quadrados preenchidos";
    save();
  }

  // ---------- início ----------
  let startN = 41;
  try {
    const s = JSON.parse(localStorage.getItem(STORE_PREFIX + "settings") || "null");
    if (s && SIZES.includes(s.N)) startN = s.N;
    if (s && s.color) color = s.color;
  } catch (_) {}
  build(startN);
  setColor(color);

  // ---------- limpar tudo ----------
  const confirmBg = document.getElementById("confirmBg");
  document.getElementById("clearAll").onclick = () => confirmBg.classList.add("open");
  document.getElementById("cancelClear").onclick = () => confirmBg.classList.remove("open");
  document.getElementById("okClear").onclick = () => {
    cells.fill(null);
    els.forEach(e => e.style.background = "#fff");
    afterChange();
    confirmBg.classList.remove("open");
  };

  // ---------- PDF ----------
  function hexToRgb(h) {
    const v = parseInt(h.slice(1), 16);
    return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
  }

  function buildPdf() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
    const pageW = 210, pageH = 297, margin = 15;
    const withRulers = document.getElementById("showRulers").checked;
    const gutter = withRulers ? 11 : 0;        // espaço para as réguas
    const side = pageW - margin * 2 - gutter;  // lado da grade em mm
    const cell = side / N;
    const x0 = margin + gutter, y0 = (pageH - side) / 2 + gutter / 2;

    if (withRulers) {
      doc.setFontSize(N <= 33 ? 10 : 9);
      for (let k = 1; k <= N; k++) {
        const mk = isMark(k);
        doc.setTextColor(mk ? 30 : 110);
        doc.setFont("helvetica", mk ? "bold" : "normal");
        const mid = (k - 0.5) * cell;
        doc.text(String(k), x0 + mid, y0 - 1.5, { align: "center" });
        doc.text(String(k), x0 - 1.5, y0 + mid, { align: "right", baseline: "middle" });
      }
    }

    for (let i = 0; i < N * N; i++) {
      if (!cells[i]) continue;
      const r = Math.floor(i / N), c = i % N;
      const [R, G, B] = hexToRgb(cells[i]);
      doc.setFillColor(R, G, B);
      // pequena sobreposição evita frestas brancas entre quadrados vizinhos
      doc.rect(x0 + c * cell, y0 + r * cell, cell + 0.02, cell + 0.02, "F");
    }

    if (document.getElementById("showLines").checked) {
      for (let k = 0; k <= N; k++) {
        const strong = k === 0 || k === N || isGuide(k);
        doc.setDrawColor(strong ? 150 : 205);
        doc.setLineWidth(strong ? 0.25 : 0.12);
        doc.line(x0 + k * cell, y0, x0 + k * cell, y0 + side);
        doc.line(x0, y0 + k * cell, x0 + side, y0 + k * cell);
      }
    } else {
      doc.setDrawColor(150);
      doc.setLineWidth(0.25);
      doc.rect(x0, y0, side, side, "S");
    }
    return doc.output("blob");
  }

  const saveBtn = document.getElementById("savePdf");
  let downloads = null;
  const insideClaude = !!(window.claude && typeof window.claude.use === "function");

  saveBtn.addEventListener("click", async () => {
    if (!window.jspdf) {
      statusEl.textContent = "A biblioteca de PDF não carregou. Recarregue a página.";
      return;
    }
    let name = (fnameEl.value || `grade-${N}x${N}`).trim();
    name = name.replace(/\.pdf$/i, "").replace(/[\\/:*?"<>|]+/g, "-") || `grade-${N}x${N}`;
    // fora do Claude (ex.: GitHub Pages ou arquivo local): download normal do navegador
    if (!insideClaude) {
      const url = URL.createObjectURL(buildPdf());
      const a = document.createElement("a");
      a.href = url; a.download = name + ".pdf";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      statusEl.textContent = "PDF gerado.";
      return;
    }
    if (!downloads) {
      statusEl.textContent = "Salvar arquivos não está disponível nesta visualização.";
      return;
    }
    saveBtn.disabled = true;
    statusEl.textContent = "Gerando PDF…";
    try {
      await downloads.save({ filename: name + ".pdf", data: buildPdf() });
      statusEl.textContent = "PDF salvo.";
    } catch (err) {
      const code = err && err.code;
      if (code === "declined") statusEl.textContent = "Salvamento cancelado.";
      else if (code === "rate_limited") statusEl.textContent = "Aguarde um instante e tente de novo.";
      else statusEl.textContent = "Não foi possível salvar o PDF aqui.";
    } finally {
      saveBtn.disabled = false;
    }
  });

  if (insideClaude) {
    window.claude.use("downloads").then(d => {
      downloads = d;
      if (!d) statusEl.textContent = "Salvar arquivos não está disponível nesta visualização.";
    }).catch(() => {});
  }
})();
</script>
</body>
</html>
